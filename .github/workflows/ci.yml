# Lint + typecheck + test on every push and PR (PLAN.md Phase 0).
# One job, not a matrix: this app targets a single pinned Python
# (.python-version), so testing other versions would buy nothing.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    # The Python app lives in backend/; run every shell step there. Steps
    # using `uses:` (checkout, setup-uv) ignore this and act on the repo root.
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # --frozen: fail if uv.lock is out of sync with pyproject.toml
      # instead of silently re-resolving — CI must test what's committed.
      - name: Install dependencies
        run: uv sync --frozen

      - name: Format check
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy

      - name: Tests
        run: uv run pytest
