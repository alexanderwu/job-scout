# Lint + typecheck + test on every push and PR (PLAN.md Phase 0).
# One job, not a matrix: this app targets a single pinned Python
# (.python-version), so testing other versions would buy nothing.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    # The Python app lives in backend/; run every shell step there. Steps
    # using `uses:` (checkout, setup-uv) ignore this and act on the repo root.
    defaults:
      run:
        working-directory: backend
    # Same images docker-compose.yml runs locally, so the integration
    # tests (dedupe against real Postgres) exercise CI too instead of
    # silently skipping. Skipped-in-CI DB tests would rot unnoticed.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: jobscout
          POSTGRES_PASSWORD: jobscout
          POSTGRES_DB: jobscout_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jobscout"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      TEST_DATABASE_URL: postgresql://jobscout:jobscout@localhost:5432/jobscout_test
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # --frozen: fail if uv.lock is out of sync with pyproject.toml
      # instead of silently re-resolving — CI must test what's committed.
      - name: Install dependencies
        run: uv sync --frozen

      - name: Format check
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy

      - name: Tests
        run: uv run pytest

  # Frontend gate: types + a production build. No unit tests yet — the
  # pages are thin views over the API (which the backend job tests);
  # `next build` catches the classes of error they can actually have
  # (type mismatches against lib/api.ts, invalid server/client component
  # boundaries).
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build
