[project]
name = "jobscout"
version = "0.1.0"
description = "Personal job-search assistant: ranked job matches with visible reasoning."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "httpx>=0.27",
    "pgvector>=0.3",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "pypdf>=5",
    "redis>=5",
    "rq>=2.4",
    "sqlalchemy>=2.0",
    "typer>=0.12",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]
ml = [
    "sentence-transformers>=3",
]

[project.scripts]
jobscout = "jobscout.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobscout"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (undefined names, unused imports)
    "I",   # isort (import ordering)
    "UP",  # pyupgrade (prefer modern syntax for the pinned Python version)
    "B",   # flake8-bugbear (likely-bug patterns, e.g. mutable default args)
    "SIM", # flake8-simplify
    "C4",  # comprehension cleanups
    "PT",  # pytest style
    "RUF", # ruff-native rules
]

[tool.mypy]
strict = true
mypy_path = "src"
files = ["src", "tests"]

# sentence-transformers is an optional (ml group) dependency with no
# type stubs; it's imported lazily behind the EmbeddingProvider
# interface. Scoped ignore, not a global one — everything else stays
# strictly checked.
[[tool.mypy.overrides]]
module = ["sentence_transformers", "sentence_transformers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
