# Alembic (schema migrations) config — deliberately minimal.
#
# Why migrations at all, instead of `Base.metadata.create_all()`?
# create_all only *adds* what's missing; it can't alter or drop, so the
# first schema change on a database with real ingested history would
# mean wipe-and-refetch. Migrations give the schema a versioned,
# replayable history — `alembic upgrade head` takes any database, empty
# or old, to current.
#
# The database URL is not here: env.py reads DATABASE_URL from the same
# Settings the app uses, so there is exactly one source of connection
# truth (.env) instead of two files to keep in sync.

[alembic]
script_location = migrations
# Template for new migration filenames: chronological prefix + slug.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
